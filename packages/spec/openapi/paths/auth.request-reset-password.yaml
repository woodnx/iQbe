post: 
  tags: 
    - auth
  summary: パスワードリセットを要求
  requestBody:
    required: true
    content:
      application/json:
        schema: 
          type: object
          properties:
            username: 
              type: string
            email: 
              type: string
          required:
            - username
            - email
        example: 
          username: hoge
          email: hoge@example.com
  responses:
    "201": 
      description: 成功
      content:
        application/json:
          schema: 
            type: string
          example: "send email"
    "400":
      $ref: "../../openapi.yaml#/components/responses/400BadRequest"
    "401": 
      $ref: "../../openapi.yaml#/components/responses/401Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/403Forbidden"
