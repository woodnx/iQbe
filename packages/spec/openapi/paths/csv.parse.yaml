post: 
  tags:
    - file
  requestBody:
    content:
      text/csv:
        schema:
          type: object
          properties:
            file:
              type: string
              format: binary
  responses:
    "200":
      description: 問題文と解答
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                question: 
                  type: string
                answer: 
                  type: string
                anotherAnswer:
                  type: string
              required:
                - question
                - answer
          example:
            - question: すい臓にある組織・ランゲルハンス島の発見者であるランゲルハンスは、現在でいうどこの国の病理学者でしょう？
              answer: ドイツ
    "400":
      $ref: "../../openapi.yaml#/components/responses/400BadRequest"
    "401": 
      $ref: "../../openapi.yaml#/components/responses/401Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/403Forbidden"
