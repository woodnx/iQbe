services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: iQbe
    restart: always
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jwt-config:/iQbe/.config
  db:
    image: mysql:9.1
    container_name: iQbe-db
    restart: always
    env_file:
      - .config/.env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - iqbe-data:/var/lib/mysql
      - ./db/conf.d:/etc/mysql/conf.d

volumes:
  jwt-config:
  iqbe-data:
    driver: local
