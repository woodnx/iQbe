post: 
  tags:
    - auth
  summary: パスワードリセットを実行
  requestBody:
    required: true
    content:
      application/json:
        schema: 
          type: object
          properties:
            token: 
              type: string
            newPassword:
              type: string
          required:
            - token
            - newPassword
        example: 
          token: 78FE38FF-8AC7-4625-BF54-D4695EB30EE2
          newPassword: newP@ssw0rd
  responses:
    "200":
      description: リセット成功
      content:
        application/json:
          schema: 
            type: string
          example: "succeed reset password"
    "400":
      $ref: "../../openapi.yaml#/components/responses/400BadRequest"
    "401": 
      $ref: "../../openapi.yaml#/components/responses/401Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/403Forbidden"
